name: Deploy ASP.NET Core API to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write

concurrency:
  group: azure-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  BUILD_CONFIGURATION: Release
  AZURE_WEBAPP_NAME: azure-devops-function

jobs:
  pr-validation:
    uses: ./.github/workflows/reusable-dotnet-validation.yml
    with:
      dotnet-version: '8.0.x'
      build-configuration: 'Release'
      min-coverage-threshold: 80

  deploy:
    needs: pr-validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore DotNet8Starter.sln

      - name: Build
        run: dotnet build DotNet8Starter.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Publish application
        run: dotnet publish src/DotNet8Starter.Api/DotNet8Starter.Api.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --output ./publish --no-build

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish
